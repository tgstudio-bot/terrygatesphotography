<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terry Gates</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="home">
  <a class="skip" href="#bio">Skip to about</a>
  <header class="top">
    <a class="top-name" href="#hero">Terry Gates</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="when-closed">Menu</span>
      <span class="when-open">Close</span>
    </button>
    <nav class="top-nav" id="site-menu" aria-label="Sections"></nav>
  </header>
  <main>
    <section class="hero" id="hero">
      <div class="hero-frame">
        <img
          class="hero-img"
          src="photos/studio-06.jpg"
          alt="Model seated in a red suit"
          width="1039"
          height="1296"
        >
        <div class="hero-veil" aria-hidden="true"></div>
        <div class="hero-copy">
          <h1>Terry Gates</h1>
          <p>Photography</p>
        </div>
      </div>
    </section>
    <section class="bio" id="bio">
      <p class="eyebrow">About</p>
      <p class="bio-text"></p>
      <p class="bio-links"></p>
    </section>
    <section class="clients" id="clients"></section>
    <div id="galleries"></div>
    <section class="contact" id="contact"></section>
  </main>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
